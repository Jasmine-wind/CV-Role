services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\"; redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  minio:
    # MinIO RELEASE.2025-04-22T22-12-26Z, pinned to the verified multi-arch manifest.
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  minio-init:
    # MinIO Client RELEASE.2025-04-16T18-13-26Z, pinned to the verified multi-arch manifest.
    image: quay.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: /bin/sh
    command:
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        && mc mb --ignore-existing "local/$$MINIO_BUCKET"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      APP_REDIS_CACHE_ENABLED: ${APP_REDIS_CACHE_ENABLED:-true}
      APP_REDIS_DEFAULT_TTL_SECONDS: ${APP_REDIS_DEFAULT_TTL_SECONDS:-86400}
      APP_REDIS_AI_DISPLAY_MODEL_TTL_SECONDS: ${APP_REDIS_AI_DISPLAY_MODEL_TTL_SECONDS:-86400}
      APP_REDIS_KEY_PREFIX: ${APP_REDIS_KEY_PREFIX:-ai-resume-optimizer}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:?APP_CORS_ALLOWED_ORIGIN_PATTERNS is required}
      # Production storage is intentionally fixed: a developer .env must not silently select local disk.
      APP_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-16000}
      AI_CREDENTIALS_ENABLED: "true"
      AI_CREDENTIALS_ACTIVE_KEY_ID: ${AI_CREDENTIALS_ACTIVE_KEY_ID:?AI_CREDENTIALS_ACTIVE_KEY_ID is required}
      AI_CREDENTIALS_KEY_RING: ${AI_CREDENTIALS_KEY_RING:?AI_CREDENTIALS_KEY_RING is required}
      AI_USAGE_RETENTION_ENABLED: ${AI_USAGE_RETENTION_ENABLED:-true}
      AI_USAGE_RETENTION_DAYS: ${AI_USAGE_RETENTION_DAYS:-90}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      EMBEDDING_MAX_INPUT_LENGTH: ${EMBEDDING_MAX_INPUT_LENGTH:-8000}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-info}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-info}
      LOG_FILE_PATH: /app/logs/backend.log
    volumes:
      - backend_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?DEPLOY_DOMAIN is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d/ai-resume.prod.conf.template:/etc/nginx/production/ai-resume.prod.conf.template:ro,Z
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  certbot:
    image: certbot/certbot@sha256:398c47284a6d6782825be71685f677ef3a1e65b8b5c278a8b1e99f6da84b4eb9
    restart: unless-stopped
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: certbot
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --email
      - ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
      - --agree-tos
      - --no-eff-email
      - --non-interactive
      - -d
      - ${DEPLOY_DOMAIN:?DEPLOY_DOMAIN is required}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_logs:
  certbot_www:
  letsencrypt:
