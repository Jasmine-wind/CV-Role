server:
  port: 8080

spring:
  application:
    name: ai-resume-optimizer-backend
  ai:
    openai:
      api-key: sk-fec820b77cd049f3bfd1a8b15a06eb20
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: ${OPENAI_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_resume_optimizer
    username: dawn
    password: '041103'
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: info

jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  expiration-minutes: 120

app:
  storage:
    local:
      base-dir: uploads
  resume:
    upload:
      max-file-size-bytes: 10485760
  ai:
    openai-compatible:
      api-key: ${spring.ai.openai.api-key}
      base-url: https://api.deepseek.com
      model: ${spring.ai.openai.chat.options.model}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:90}
      temperature: ${OPENAI_TEMPERATURE:0.2}
      max-tokens: ${OPENAI_MAX_TOKENS:800}
