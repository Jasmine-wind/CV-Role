server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ai-resume-optimizer-backend
  profiles:
    default: dev
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-v4-flash}
          temperature: ${OPENAI_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
  level:
    root: info

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 120

app:
  storage:
    local:
      base-dir: ${LOCAL_STORAGE_BASE_DIR:uploads}
  resume:
    upload:
      max-file-size-bytes: 10485760
  ai:
    openai-compatible:
      api-key: ${spring.ai.openai.api-key}
      base-url: ${spring.ai.openai.base-url}
      model: ${spring.ai.openai.chat.options.model}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:90}
      temperature: ${OPENAI_TEMPERATURE:0.2}
      max-tokens: ${OPENAI_MAX_TOKENS:4000}
    embedding-compatible:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:}
      model: ${EMBEDDING_MODEL:Qwen3-Embedding-0.6B}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout: ${EMBEDDING_TIMEOUT:30}
      max-input-length: ${EMBEDDING_MAX_INPUT_LENGTH:8192}
