server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ai-resume-optimizer-backend
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-v4-flash}
          temperature: ${OPENAI_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_resume_optimizer
    username: dawn
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: info

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 120

app:
  storage:
    local:
      base-dir: uploads
  resume:
    upload:
      max-file-size-bytes: 10485760
  ai:
    openai-compatible:
      api-key: ${spring.ai.openai.api-key}
      base-url: https://api.deepseek.com
      model: ${spring.ai.openai.chat.options.model}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:90}
      temperature: ${OPENAI_TEMPERATURE:0.2}
      max-tokens: ${OPENAI_MAX_TOKENS:800}
