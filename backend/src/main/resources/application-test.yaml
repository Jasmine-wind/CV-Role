spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ai_resume_optimizer_test}
    username: ${TEST_DB_USERNAME:dawn}
    password: ${TEST_DB_PASSWORD:test_password}
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${TEST_DASHSCOPE_API_KEY:test-api-key}

jwt:
  secret: ${TEST_JWT_SECRET:test-jwt-secret-for-local-automated-tests-only}
  expiration-minutes: 30

app:
  storage:
    local:
      base-dir: ${TEST_LOCAL_STORAGE_BASE_DIR:build/test-uploads}
  ai:
    openai-compatible:
      timeout-seconds: ${TEST_OPENAI_TIMEOUT_SECONDS:5}

logging:
  level:
    root: warn
    com.winter.airesumeoptimizer: info

