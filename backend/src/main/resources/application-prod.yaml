spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

app:
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${APP_ASYNC_THREAD_NAME_PREFIX:ai-resume-task-}
    await-termination-seconds: ${APP_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:ai-resume-files}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  ai:
    openai-compatible:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      model: ${AI_MODEL}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
      temperature: ${AI_TEMPERATURE:0.2}
      max-tokens: ${AI_MAX_TOKENS:4000}
    embedding-compatible:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:}
      model: ${EMBEDDING_MODEL:}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout: ${EMBEDDING_TIMEOUT_SECONDS:30}
      max-input-length: ${EMBEDDING_MAX_INPUT_LENGTH:8192}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    com.winter.airesumeoptimizer: ${LOG_LEVEL_APP:info}
